
name: Collection Agent Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check model files
        run: |
          pwd
          ls -lb models/
          git ls-files models/

      - name: Diagnose Donation model path
        run: |
          node -e "console.log('Resolved:', require.resolve('./models/Donation.js'))"
          node -e "console.log('Mongoose:', require.resolve('mongoose'))"

      - name: Check Jest configuration
        run: npx --yes jest --showConfig

      - name: Run Collection Agent tests
        run: npx --yes jest services/collectionAgentService.test.js --runInBand --no-cache
